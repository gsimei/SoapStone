[package]
name = "soapstone"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Soapstone: a lightweight SOAP client"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
soapstone-core = { path = "../../crates/soapstone-core" }
soapstone-http = { path = "../../crates/soapstone-http" }
soapstone-store = { path = "../../crates/soapstone-store" }
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["sync", "macros"] }
