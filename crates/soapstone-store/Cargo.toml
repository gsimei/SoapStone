[package]
name = "soapstone-store"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Local SQLite storage for the Soapstone client"

[dependencies]
soapstone-core = { path = "../soapstone-core" }
soapstone-http = { path = "../soapstone-http" }
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
roxmltree = "0.21"
url = "2"
keyring = "4.2"

[dev-dependencies.tokio]
version = "1"
features = ["macros", "rt"]
