[package]
name = "soapstone-http"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Sends SOAP requests for the Soapstone client"

[dependencies]
soapstone-core = { path = "../soapstone-core" }
reqwest = "0.13"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
quick-xml = "0.42"
roxmltree = "0.21"
base64 = "0.23"
chrono = "0.4"
getrandom = "0.4"
ntlmclient = "0.2"
p12-keystore = "0.4"
sha1 = "0.11"

[dev-dependencies]
hmac = "0.12"
md-5 = "0.10"
md4 = "0.10"
rustls = "0.23"
serde_json = "1"

[dev-dependencies.tokio]
version = "1"
features = ["macros", "rt"]
